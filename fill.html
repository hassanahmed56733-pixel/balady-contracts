<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>العقود التجارية - شركة ماس ديفليوبمنت</title>
    <style>
        body{font-family:Tahoma,sans-serif;background:#f0fdfa;margin:0;padding:16px;color:#134e4a}
        .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:480px;margin:0 auto}
        h2{margin:0 0 6px;font-size:1.2em}
        .sub{color:#64748b;font-size:.85em;margin-bottom:16px}
        label{display:block;font-weight:700;font-size:.82em;margin:12px 0 4px}
        input,textarea{width:100%;padding:11px;border:2px solid #cbd5e1;border-radius:10px;font-size:16px;box-sizing:border-box}
        input:focus,textarea:focus{outline:none;border-color:#0f766e}
        .req{color:#dc2626}
        .btn{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:12px;font-size:1.05em;font-weight:700;margin-top:18px;cursor:pointer}
        .readonly{background:#f1f5f9;color:#475569}
        .hint{color:#64748b;font-size:.8em;line-height:1.6;margin-top:12px}
    </style>
</head>
<body>
<div class="card">
    <h2>العقود التجارية — شركة ماس ديفليوبمنت</h2>
    <div class="sub">نموذج تعبئة بيانات العقد</div>
    <p class="sub">رقم العقد: <b id="contractNumber">-</b><br>العميل: <b id="customerName">-</b></p>

    <label>اسم العميل</label>
    <input id="name" class="readonly" readonly>

    <label>رقم الجوال <span class="req">*</span></label>
    <input id="phone" type="tel" placeholder="05xxxxxxxx">

    <label>رابط الموقع (جوجل ماب) <span class="req">*</span></label>
    <input id="mapUrl" type="url" placeholder="https://maps.google.com/...">

    <label>البريد الإلكتروني <span class="req">*</span></label>
    <input id="email" type="email" placeholder="name@example.com" required>

    <label>المساحة م²</label>
    <input id="area" type="text" placeholder="مثال: 120">

    <label>تصنيف الآيزك / النشاط</label>
    <input id="isic" type="text" placeholder="مثال: محلات تقديم المشروبات">

    <label>الحي / الموقع</label>
    <input id="district" type="text" placeholder="اسم الحي">

    <label>البلدية <span class="req">*</span></label>
    <select id="municipality" required>
        <option value="">اختر البلدية</option>
        <option value="قطاع الشمال">قطاع الشمال</option>
        <option value="قطاع الغرب">قطاع الغرب</option>
    </select>

    <label>ملاحظات</label>
    <textarea id="notes" rows="2"></textarea>

    <button class="btn" type="button" onclick="send()">إرسال البيانات عبر واتساب</button>
    <p class="hint">بعد الضغط على الإرسال، سيُفتح واتساب لإرسال البيانات إلى مسؤول العقد.</p>
</div>
<script>
    const ADMIN_PHONE = '966546000219';
    const params = new URLSearchParams(window.location.search);
    const value = (key) => params.get(key) || '';
    const setValue = (id, key) => { document.getElementById(id).value = value(key); };

    document.getElementById('contractNumber').textContent = value('contract');
    document.getElementById('customerName').textContent = value('name');
    setValue('name', 'name');
    setValue('phone', 'phone');
    setValue('mapUrl', 'mapUrl');
    setValue('email', 'email');
    setValue('area', 'area');
    setValue('isic', 'isic');
        setValue('district', 'district');
        setValue('municipality', 'municipality');
        setValue('notes', 'notes');

    function isValidGoogleMapsLink(url){
        const raw = String(url || '').trim();
        if (!raw) return false;
        let parsed;
        try { parsed = new URL(raw); } catch (e) { return false; }
        const host = parsed.hostname.toLowerCase();
        if (host === 'maps.app.goo.gl') {
            return parsed.protocol === 'https:' && parsed.pathname.length > 1;
        }
        const isGoogleHost = /(^|\.)google\.[a-z.]+$/.test(host) || /^maps\.google\./.test(host);
        if (!isGoogleHost || !/(^|\/)maps(\/|$)/i.test(parsed.pathname + parsed.hostname)) return false;
        const compact = raw.replace(/\s+/g, '');
        const coordinatePattern = /@(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/;
        const queryPattern = /[?&](?:q|query|ll)=(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/i;
        const pathPattern = /!3d(-?\d{1,3}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/;
        const match = compact.match(coordinatePattern) || compact.match(queryPattern) || compact.match(pathPattern);
        if (!match) return false;
        const lat = parseFloat(match[1]);
        const lng = parseFloat(match[2]);
        return Number.isFinite(lat) && Number.isFinite(lng) && lat >= 16 && lat <= 33 && lng >= 34 && lng <= 56;
    }

    function send(){
        const contract = value('contract');
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const mapUrl = document.getElementById('mapUrl').value.trim();
        const email = document.getElementById('email').value.trim();
        const municipality = document.getElementById('municipality').value.trim();
        if(!phone){ alert('رقم الجوال مطلوب'); return; }
        if(!isValidGoogleMapsLink(mapUrl)){
            alert('رابط Google Maps غير صالح. أدخل رابطًا كاملًا مثل https://maps.app.goo.gl/UBJPSFkpPepSc9AY7 أو رابطًا يحتوي على إحداثيات.'); return;
        }
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
            alert('البريد الإلكتروني مطلوب ويجب أن يكون صحيحًا'); return;
        }
        if(!municipality){ alert('البلدية مطلوبة'); return; }
        const msg = `تم تعبئة بيانات العقد *${contract}*\n\nالاسم: ${name || '-'}\nالجوال: ${phone}\nرابط الموقع: ${mapUrl}\nالبريد: ${email}\nالمساحة: ${document.getElementById('area').value.trim() || '-'}\nالنشاط: ${document.getElementById('isic').value.trim() || '-'}\nالحي: ${document.getElementById('district').value.trim() || '-'}\nالبلدية: ${municipality}\nملاحظات: ${document.getElementById('notes').value.trim() || '-'}`;
        window.location.href = 'https://wa.me/' + ADMIN_PHONE + '?text=' + encodeURIComponent(msg);
    }
</script>
</body>
</html>
